commit-msg:
  commands:
    # octo-managed: octo decides which checks run; skip one in .octo/exceptions.yml. Change it in octo, not here.
    octo:
      run: octo hook commit-msg {1}
pre-push:
  commands:
    # octo-managed: octo decides which checks run; skip one in .octo/exceptions.yml. Change it in octo, not here.
    octo:
      run: octo hook pre-push {1}
      use_stdin: true
pre-commit:
  commands:
    # octo-managed: octo decides which checks run; skip one in .octo/exceptions.yml. Change it in octo, not here.
    octo:
      run: octo hook pre-commit {staged_files}
