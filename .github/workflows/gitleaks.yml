# octo-managed — reasserted by 'octo callback install gitleaks'; change it in @cloudstashhq/infra-checks, not here.
# octo revision 3 (gitleaks 8.30.1) — an older octo never overwrites a higher revision.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ DO NOT EDIT THIS FILE. It is GENERATED by octo and OVERWRITTEN in full   │
# │ every time `octo callback install gitleaks` runs in this repo. Any edit  │
# │ you make here is silently destroyed on the next run — no warning, no     │
# │ merge, no backup. Its text is owned by @cloudstashhq/infra-checks        │
# │ (buildGitleaksCiWorkflow, GITLEAKS_PIN): change it there and release;    │
# │ octo writes what that package builds.                                    │
# │                                                                          │
# │ It is kept current by the pre-commit hook: when octo has a newer         │
# │ revision, the hook rewrites this file and stops the commit so the        │
# │ update is staged and reviewed with it. A repo nobody commits to can      │
# │ still lag; `octo repo doctor` reports drift.                             │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Server-side secret scan — the backstop for our secret hygiene. Local
# lefthook/gitleaks (pre-commit) catches mistakes early but is bypassable
# (--no-verify, or a clone that never ran 'lefthook install'). This runs in
# CI on every push and PR, so a committed secret shows up as a failed check.
# Whether the check is REQUIRED is branch-protection policy on GitHub — a
# per-repo decision that does not live in this file.
#
# NOTE: we invoke the gitleaks BINARY directly (MIT-licensed, free) rather
# than the gitleaks/gitleaks-action wrapper. The wrapper's license is free
# for only ONE org repo; scanning multiple repos in an org is PAID. An estate
# of org repos would owe a license. The binary is the same scanner, same
# .gitleaks.toml, no license — so we install it and skip the action entirely.
#
# RUNNER: the org's standard runner variable (vars.CI_RUNNER), else
# ubuntu-latest where this repo cannot see it, so the scan always runs;
# .octo/gitleaks.yml's runs_on overrides both. The job holds no credentials:
# its token is read-only, it reads no secret, and the checkout keeps no token.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so gitleaks scans the whole range
          persist-credentials: false   # the scan never talks to the remote

      - name: install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256_X64: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          GITLEAKS_SHA256_ARM64: 'e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080'
          ARCH: ${{ runner.arch }}
        run: |
          # Pinned in @cloudstashhq/infra-checks (GITLEAKS_PIN), one sha256 per
          # runner arch; verified before extracting.
          case "$ARCH" in
            X64) TARBALL_ARCH=x64; GITLEAKS_SHA256="$GITLEAKS_SHA256_X64" ;;
            ARM64) TARBALL_ARCH=arm64; GITLEAKS_SHA256="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "::error::no gitleaks is pinned for runner arch '$ARCH': only X64 and ARM64 are"; exit 1 ;;
          esac
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_${TARBALL_ARCH}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$TARBALL"
          echo "${GITLEAKS_SHA256}  $TARBALL" | sha256sum -c -
          tar -xzf "$TARBALL" -C /usr/local/bin gitleaks
          gitleaks version

      - name: scan git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose
