#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ DO NOT EDIT THIS FILE. It is GENERATED by octo and OVERWRITTEN in full   │
# │ every time `octo callback setup gitleaks` runs in this repo. Any edit     │
# │ you make here is silently destroyed on the next run — no warning, no     │
# │ merge, no backup. Change it in octo's ciWorkflow() and release.          │
# │                                                                          │
# │ It also does NOT update itself. Upgrading octo changes what setup WOULD  │
# │ write, never what this repo HAS — so this file can sit several octo      │
# │ versions behind (missing, say, a security fix to a pinned action) and    │
# │ nothing will say so. Re-run `octo callback setup gitleaks` after an octo  │
# │ upgrade; `octo repo doctor` reports when this file has drifted.           │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Server-side secret scan — the backstop for our secret hygiene. Local
# lefthook/gitleaks (pre-commit) catches mistakes early but is bypassable
# (--no-verify, or a clone that never ran 'lefthook install'). This runs in
# CI on every push and PR, so a committed secret shows up as a failed check.
# Whether the check is REQUIRED is branch-protection policy on GitHub — a
# per-repo decision that does not live in this file.
#
# NOTE: we invoke the gitleaks BINARY directly (MIT-licensed, free) rather
# than the gitleaks/gitleaks-action wrapper. The wrapper's license is free
# for only ONE org repo; scanning multiple repos in an org is PAID. An estate
# of org repos would owe a license. The binary is the same scanner, same
# .gitleaks.toml, no license — so we install it and skip the action entirely.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so gitleaks scans the whole range

      - name: install gitleaks (latest)
        run: |
          # Install the LATEST gitleaks release, never a pinned version. A
          # secret scanner should scan with current rules; octo owns the
          # workflow STRUCTURE, not which gitleaks version a repo runs.
          # Resolve the newest tag from the GitHub API, then fetch its tarball.
          VERSION=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -m1 '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          test -n "$VERSION" || { echo "::error::could not resolve latest gitleaks release"; exit 1; }
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: scan git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose
